services:
  api:
    build:
      context: ./api
    ports:
      - "8787:8787"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

  web:
    build:
      context: ./web
    ports:
      - "5787:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8787
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
